name: Feature request
description: Suggest an idea or improvement for VanUikit
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement. Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve? What are you trying to build?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Include API ideas if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Examples, references, or screenshots.
    validations:
      required: false
