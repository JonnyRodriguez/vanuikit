name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (typecheck · tests · size · build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: vanuikit
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install
        working-directory: .

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Tests
        run: bun test

      - name: Van reactivity scan (check:van)
        run: bun run check:van

      - name: Language gates (cspell · i18n dicts · UI strings)
        run: bun run check:spell && bun run i18n:check && bun run i18n:scan -- --check
        working-directory: .

      - name: Size budget (bun run size)
        run: bun run size

  docs:
    name: Docs portal (Starlight build + playground)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install

      - name: Install docs dependencies
        run: bun install --cwd docs-site

      - name: Build docs and component playground
        run: bun run docs:build
