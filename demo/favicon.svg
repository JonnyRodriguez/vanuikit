<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- blue circle touching the 4 edges, transparent corners -->
  <circle cx="256" cy="256" r="256" fill="#084C7D"/>
  <!-- handle + left stroke of the V + base bar -->
  <path d="M89 156 H167 L228 312 H370" fill="none" stroke="#fff"
        stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right stroke of the V -->
  <path d="M238 304 L311 148" fill="none" stroke="#fff"
        stroke-width="24" stroke-linecap="round"/>
  <!-- basket (parallelogram, now above the bar, not touching it) -->
  <path d="M323 181 H414 L367 286 H276 Z" fill="#fff"/>
  <!-- wheels -->
  <circle cx="233" cy="364" r="25" fill="#fff"/>
  <circle cx="337" cy="364" r="25" fill="#fff"/>
</svg>
