<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any" />
  <title>VanUikit — Component Playground</title>
  <link rel="stylesheet" href="./vanuikit.css" />
  <link rel="stylesheet" href="./uno.css" />
  <style>
    .playground-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    .playground-topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .playground-back {
      font-size: 0.875rem;
      color: var(--vui-muted);
      text-decoration: none;
    }
    .playground-back:hover {
      color: var(--vui-primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="playground-shell">
    <div class="playground-topbar">
      <a class="playground-back" href="../">← Documentation</a>
    </div>
    <div id="app"></div>
  </div>
  <script type="module" src="./playground.js"></script>
</body>
</html>
